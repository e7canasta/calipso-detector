[camera]
site = "north-residence"
id = "room-12"

[stream]
url = "rtsp://192.168.1.2:8554/sample1"
# username = "user"
# password = "secret"
keyframe_only = true
reconnect_delay_secs = 5
sample_interval_ms = 1000
stall_timeout_secs = 10

[senses.detect]
model = "yolo26s.onnx" # relative to CALIPSO_MODELS, or an absolute path
backend_confidence = 0.25

# Optional reinforcement: without the section, the core policy stays off.
# [senses.reinforce]
# model = "yolo26l.onnx" # relative to CALIPSO_MODELS, or an absolute path
# backend_confidence = 0.25 # cannot exceed policy.min_confidence
# bed_padding = 0.15 # fraction of the bed's width and height on each side

# Optional faces: without the section, the core does not ask for faces.
# [senses.faces]
# model = "face/yolov12l-face.onnx" # FP16, input 192
# backend_confidence = 0.25 # cannot exceed senses.faces.min_confidence
# min_confidence = 0.30

# Optional pose: without the section, the core does not ask for the subject's pose.
# [senses.pose]
# model = "yolo26s-pose.onnx"
# backend_confidence = 0.25 # backend floor for each person's box
# move_threshold = 0.1 # requested again if the subject shifts this fraction of their diagonal
# min_keypoint_score = 0.3 # pose keypoints where depth is measured
# max_age_secs = 60.0 # (903) request again the pose of someone still at this age, in
#                     # source seconds; without the key, a still pose is not requested again

# Optional depth: with [senses.pose] it measures the subject; with [calibration],
# the empty bed. With neither, the profile is rejected.
# [senses.depth]
# model = "yolo26s-depth.onnx"
# posture_tolerance = 0.05 # (904) |relative disparity| up to which the posture is "sitting";
#                          # 0.05 by default, provisional (measurement 912)

# Calibrate the empty bed: requires [senses.depth].
# [calibration]
# retry_secs = 2.0 # source seconds between failed attempts

[policy]
min_confidence = 0.5
same_body_iou = 0.5
near_bed_margin = 0.10
dwell_secs = 2.0 # source seconds a new count must hold

[map]
resolution = [1920, 1080]
bed = [[746,139], [1068,136], [1170,778], [652,743]]
# Face region when no body is seen; with a body, the core asks for its box.
# headboard = [746,139,1068,250]

[nats]
url = "nats://127.0.0.1:4222"
# prefix = "vision.north-residence.room-12"
