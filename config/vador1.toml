# Local go2rtc, always live. Bed drawn on a frame from 2026-10-08.
[camera]
site = "local"
id = "vador1"

[stream]
url = "rtsp://127.0.0.1:8554/vador.d1.1.main"
# username = "user"
# password = "secret"
keyframe_only = true
reconnect_delay_secs = 2
sample_interval_ms = 1000
stall_timeout_secs = 10

[senses.detect]
model = "yolo26s.onnx" # relative to CALIPSO_MODELS, or an absolute path
backend_confidence = 0.25

# Focus: while the resident is alone in bed, the main detector looks at the bed
# up close. With this bed (x 659-1148, y 136-756) and pad 0.25 the focus is
# x 537-1270, y 0-911: about twice the pixels per body. Removing the section
# turns it off.
[senses.detect.focus]
pad = 0.25 # fraction of the bed's width and height on each side
walk_secs = 3 # the least staff take to walk from the door to the bed: measure it on a recording
wide_every_secs = 3 # the whole frame at least this often; cannot exceed walk_secs

# Reinforcement, as measured on this camera; removing the section turns the policy off.
[senses.reinforce]
model = "yolo26l.onnx" # relative to CALIPSO_MODELS, or an absolute path
backend_confidence = 0.25 # cannot exceed policy.min_confidence
bed_padding = 0.15 # fraction of the bed's width and height on each side

# Faces FP16 192: turn p90 166 ms on this camera.
[senses.faces]
model = "face/yolov12l-face.onnx" # FP16, input 192
backend_confidence = 0.25 # cannot exceed senses.faces.min_confidence
min_confidence = 0.30

# Pose and depth; removing the sections turns the policy off.
[senses.pose]
model = "yolo26s-pose.onnx"
backend_confidence = 0.25
move_threshold = 0.1 # fraction of the subject's diagonal: the pose is requested again
# Margin around the subject's box: on 30 frames of sample1 (2026-10-12) it took
# the keypoints seen (score >= 0.5) from 9.1 to 12.1 per visible person; 0.3 adds nothing.
crop_pad = 0.2
min_keypoint_score = 0.5 # below it a keypoint is not seen: no depth, no reasoning, not drawn
# max_age_secs: without the key. Not needed on this camera (the pose
# renews by itself: p90 28 s between new poses).

[senses.depth]
model = "yolo26s-depth.onnx" # subject (with pose) and empty bed (with calibration)
# posture_tolerance: 0.05 by default, measured on sample1, NOT on this camera.
# Live here (2026-10-12) the head-and-shoulders against hips disparity read
# about +0.15 lying and +0.02 sitting up (p90 +0.04), pressed against 0.05:
# the engine's own classes, not hand labels. Layer 1 asks the disparity only
# with the head at the headboard; the camera's own scale waits for vador1's
# labels (R18, spec 1801).
# Depth over the bed, for the subject and the empty bed alike.
crop_pad = 0.25

# Learn the empty bed at startup; requires [senses.depth].
[calibration]
retry_secs = 2.0 # source seconds between failed attempts

# Layer 1, the bed posture (R18): whether the resident left lying is still
# lying, sat up or is getting out. It needs [map] headboard and [senses.pose].
# Initial times, not yet measured on this camera (spec 1801): each state
# counts once it held its own source seconds; getting out is the shortest.
[bed_posture]
dwell_lying_secs = 2.0
dwell_sitting_up_secs = 3.0
dwell_getting_out_secs = 1.0

# The slow verifier (white book, volume III): the core asks a closed question
# where its own reading is doubtful, and the answer fills that digit. Every
# question, its crop and its answer are what the room's classifiers learn
# from (volume IV). Remove the section and nothing is asked.
[verify]
max_per_hour = 20 # source time; MiMo answers in p50 7 s, p90 21 s
timeout_secs = 70 # source seconds; above the shell's 65 s wall timeout
held = { after_secs = 30, valid_secs = 3600 } # O1, O2
# The grey band of the disparity: sample1's, NOT measured on this camera
# (the headboard does not separate sitting up here: project 29).
doubtful_disparity = [0.02, 0.10] # P1
doubtful_feet_margin = 0.06 # P2, P3: a fraction of the bed's width

[senses.verify]
# subject = "calipso.verify.v1"
# wall_timeout_secs = 65

[policy]
min_confidence = 0.5
same_body_iou = 0.5
near_bed_margin = 0.10
dwell_secs = 2.0 # source seconds a new count must hold

[map]
resolution = [1920, 1080]
bed = [[741, 136], [1066, 141], [1148, 756], [659, 745]]
# Face region when no body is seen; with a body, the core asks for its box.
headboard = [733, 126, 1146, 340]
# Optional focus box instead of the grown bed: it must contain the bed and reach
# whoever stands next to it. Draw it on a frame, like the bed.
# focus = [540, 0, 1270, 910]

[nats]
url = "nats://127.0.0.1:4222"
# prefix = "vision.north-residence.room-12"
