[package]
name = "ingest"
description = "Ingest: RTSP, a one-slot mailbox and decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
retina = "0.4"
ffmpeg = { package = "ffmpeg-next", version = "^9.0" }
